name: paradoxo-mobilidade-jp

services:
  atlas:
    build:
      context: .
      dockerfile: docker/collector/Dockerfile
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    command:
      - python3
      - apps/collector/server.py
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --public-port
      - "${APP_PORT:-8000}"
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
